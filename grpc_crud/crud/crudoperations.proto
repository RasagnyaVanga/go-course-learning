syntax="proto3";
option go_package = "grpc_crud/crud";

package crud;

service Operation {
    rpc  Create(CreateRequest) returns (CreateResponse);
    rpc  ReadAll(ReadRequest) returns (ReadResponse);
}

message CreateRequest {
       string Title=1;
	  string Author =2;
	 string Content =3;
} 

message CreateResponse {
    int32 Id=1;
}

message ReadRequest{}

message ReadResponse {
  repeated Post posts = 1;
}

message Post {
    int32 Id=1;
     string Title=2;
	  string Author =3;
	 string Content =4;
}